name: Link2Mail Cloud Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'File, Music, or Video URL to download outside NetFree'
        required: true
        type: string
      to:
        description: 'Destination email address'
        required: true
        type: string
      subject:
        description: 'Custom email subject (optional)'
        required: false
        default: ''
        type: string
      filename:
        description: 'Custom attachment filename (optional)'
        required: false
        default: ''
        type: string

jobs:
  download-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install nodemailer
        run: |
          mkdir -p /tmp/link2mail-worker
          cd /tmp/link2mail-worker
          npm init -y > /dev/null 2>&1
          npm install --no-audit --no-fund nodemailer > /dev/null 2>&1

      - name: Download URL in Cloud and Send via Gmail
        id: worker
        env:
          TARGET_URL: ${{ github.event.inputs.url }}
          RECIPIENT_EMAIL: ${{ github.event.inputs.to }}
          CUSTOM_SUBJECT: ${{ github.event.inputs.subject }}
          CUSTOM_FILENAME: ${{ github.event.inputs.filename }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          NODE_PATH=/tmp/link2mail-worker/node_modules node << 'EOF'
          const dns = require('node:dns/promises');
          const fs = require('node:fs');
          const http = require('node:http');
          const https = require('node:https');
          const net = require('node:net');
          const path = require('node:path');
          const nodemailer = require('nodemailer');

          const MAX_EMAIL_BYTES = 18 * 1024 * 1024;
          const MAX_MULTI_EMAIL_BYTES = 17 * 1024 * 1024;
          const MAX_ARTIFACT_BYTES = 200 * 1024 * 1024;
          const MAX_HEADER_SIZE_BYTES = 131072;
          const MAX_REDIRECTS = 6;
          const FETCH_TIMEOUT_MS = 45000;

          const MIME_TO_EXT = {
            'application/pdf': '.pdf',
            'application/msword': '.doc',
            'application/vnd.openxmlformats-officedocument.wordprocessingml.document': '.docx',
            'application/vnd.ms-excel': '.xls',
            'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': '.xlsx',
            'application/vnd.ms-powerpoint': '.ppt',
            'application/vnd.openxmlformats-officedocument.presentationml.presentation': '.pptx',
            'image/jpeg': '.jpg',
            'image/png': '.png',
            'image/gif': '.gif',
            'image/webp': '.webp',
            'image/avif': '.avif',
            'image/bmp': '.bmp',
            'text/plain': '.txt',
            'text/csv': '.csv',
            'application/json': '.json',
            'application/zip': '.zip',
            'application/x-zip-compressed': '.zip',
            'application/gzip': '.gz',
            'audio/mpeg': '.mp3',
            'audio/mp3': '.mp3',
            'audio/wav': '.wav',
            'audio/x-wav': '.wav',
            'audio/ogg': '.ogg',
            'audio/opus': '.opus',
            'audio/aac': '.aac',
            'audio/mp4': '.m4a',
            'audio/x-m4a': '.m4a',
            'audio/flac': '.flac',
            'audio/x-flac': '.flac',
            'audio/webm': '.weba',
            'video/mp4': '.mp4',
            'video/webm': '.webm',
            'video/quicktime': '.mov',
            'video/x-matroska': '.mkv',
            'video/x-msvideo': '.avi',
            'video/x-m4v': '.m4v',
            'video/mpeg': '.mpeg',
            'video/3gpp': '.3gp',
            'video/ogg': '.ogv',
          };

          function isPublicIpv4(ip) {
            const p = ip.split('.').map(Number);
            if (p.length !== 4 || p.some((n) => Number.isNaN(n) || n < 0 || n > 255)) return false;
            const [a, b, c] = p;
            if (a === 0 || a === 10 || a === 127 || a >= 224) return false;
            if (a === 100 && b >= 64 && b <= 127) return false;
            if (a === 169 && b === 254) return false;
            if (a === 172 && b >= 16 && b <= 31) return false;
            if (a === 192 && b === 168) return false;
            if (a === 192 && b === 0 && (c === 0 || c === 2)) return false;
            if (a === 198 && (b === 18 || b === 19 || (b === 51 && c === 100))) return false;
            if (a === 203 && b === 0 && c === 113) return false;
            return true;
          }

          function isPublicIp(ip) {
            const norm = ip.trim().toLowerCase();
            const v = net.isIP(norm);
            if (v === 4) return isPublicIpv4(norm);
            if (v === 6) {
              if (norm === '::' || norm === '::1') return false;
              if (norm.startsWith('::ffff:')) return isPublicIpv4(norm.slice(7));
              const w = parseInt(norm.split(':')[0] || '', 16);
              if (Number.isNaN(w)) return false;
              if ((w & 0xfe00) === 0xfc00 || (w & 0xffc0) === 0xfe80 || (w & 0xff00) === 0xff00) return false;
              return true;
            }
            return false;
          }

          async function validatePublicUrl(raw) {
            const parsed = new URL(raw.trim());
            if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
              throw new Error('Only HTTP/HTTPS URLs are allowed');
            }
            if (parsed.username || parsed.password) {
              throw new Error('URLs with embedded credentials are not allowed');
            }
            const host = parsed.hostname.toLowerCase().replace(/^\[|\]$/g, '');
            if (!host || host === 'localhost' || host.endsWith('.localhost') || host.endsWith('.local') || host.endsWith('.internal')) {
              throw new Error('Private/local hosts are not allowed');
            }
            if (net.isIP(host)) {
              if (!isPublicIp(host)) throw new Error('Private IP address blocked');
              return parsed;
            }
            const records = await dns.lookup(host, { all: true });
            if (!records.length || records.some((r) => !isPublicIp(r.address))) {
              throw new Error('DNS resolved to non-public address');
            }
            return parsed;
          }

          function normalizeIncomingHeaders(rawHeaders) {
            const out = {};
            for (const [key, val] of Object.entries(rawHeaders)) {
              if (val === undefined) continue;
              out[key.toLowerCase()] = Array.isArray(val) ? val.join(', ') : val;
            }
            return out;
          }

          function sendSingleHttpRequest(targetUrl, options) {
            return new Promise((resolve, reject) => {
              const transport = targetUrl.protocol === 'https:' ? https : http;
              let settled = false;
              let req = null;
              let activeRes = null;

              const timer = setTimeout(() => {
                if (settled) return;
                settled = true;
                const err = new Error('Request timed out');
                err.name = 'AbortError';
                err.code = 'ETIMEDOUT';
                if (req) req.destroy();
                if (activeRes) activeRes.destroy();
                reject(err);
              }, options.timeoutMs);

              const finishResolve = (result) => {
                if (settled) return;
                settled = true;
                clearTimeout(timer);
                resolve(result);
              };

              const finishReject = (err) => {
                if (settled) return;
                settled = true;
                clearTimeout(timer);
                reject(err);
              };

              const reqHeaders = Object.assign({ 'Accept-Encoding': 'identity' }, options.headers || {});
              if (options.body !== undefined) {
                reqHeaders['Content-Length'] = String(Buffer.byteLength(options.body, 'utf8'));
              }

              req = transport.request(
                targetUrl,
                {
                  method: options.method || 'GET',
                  headers: reqHeaders,
                  maxHeaderSize: MAX_HEADER_SIZE_BYTES,
                },
                (res) => {
                  activeRes = res;
                  const status = res.statusCode || 0;
                  const headers = normalizeIncomingHeaders(res.headers);
                  const rawLen = headers['content-length'];
                  const declaredSize = rawLen ? Number(rawLen) : NaN;

                  if ((status >= 300 && status < 400) || options.probeOnly || options.method === 'HEAD') {
                    res.resume();
                    res.destroy();
                    finishResolve({
                      status,
                      headers,
                      buffer: Buffer.alloc(0),
                      finalUrl: targetUrl,
                      oversize: false,
                      declaredSize: Number.isNaN(declaredSize) ? 0 : declaredSize,
                    });
                    return;
                  }

                  if (!Number.isNaN(declaredSize) && declaredSize > options.maxBytes) {
                    res.destroy();
                    if (req) req.destroy();
                    finishResolve({
                      status,
                      headers,
                      buffer: Buffer.alloc(0),
                      finalUrl: targetUrl,
                      oversize: true,
                      declaredSize,
                    });
                    return;
                  }

                  const chunks = [];
                  let totalBytes = 0;

                  res.on('data', (chunk) => {
                    if (settled) return;
                    totalBytes += chunk.byteLength;
                    if (totalBytes > options.maxBytes) {
                      res.destroy();
                      if (req) req.destroy();
                      finishResolve({
                        status,
                        headers,
                        buffer: Buffer.alloc(0),
                        finalUrl: targetUrl,
                        oversize: true,
                        declaredSize: !Number.isNaN(declaredSize) ? declaredSize : totalBytes,
                      });
                      return;
                    }
                    chunks.push(chunk);
                  });

                  res.on('end', () => {
                    finishResolve({
                      status,
                      headers,
                      buffer: Buffer.concat(chunks, totalBytes),
                      finalUrl: targetUrl,
                      oversize: false,
                      declaredSize: !Number.isNaN(declaredSize) ? declaredSize : totalBytes,
                    });
                  });

                  res.on('error', finishReject);
                }
              );

              req.on('error', finishReject);
              if (options.body !== undefined) req.write(options.body, 'utf8');
              req.end();
            });
          }

          async function httpRequestWithLargeHeaders(initialUrl, options = {}) {
            const method = options.method || 'GET';
            const maxBytes = options.maxBytes || MAX_ARTIFACT_BYTES;
            const timeoutMs = options.timeoutMs || FETCH_TIMEOUT_MS;
            const maxRedirects = options.maxRedirects || MAX_REDIRECTS;
            const headers = options.headers || {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',
              Accept: '*/*',
            };

            let current = await validatePublicUrl(initialUrl);
            for (let i = 0; i <= maxRedirects; i++) {
              const res = await sendSingleHttpRequest(current, {
                method: i === 0 ? method : method === 'POST' ? 'GET' : method,
                headers,
                body: i === 0 ? options.body : undefined,
                maxBytes,
                timeoutMs,
                probeOnly: Boolean(options.probeOnly),
              });
              if (res.status >= 300 && res.status < 400) {
                const loc = res.headers.location;
                if (!loc) throw new Error('Redirect without location');
                current = await validatePublicUrl(new URL(loc, current).toString());
                if (options.stopOnRedirectMatch && options.stopOnRedirectMatch(current)) {
                  return {
                    status: res.status,
                    headers: res.headers,
                    buffer: Buffer.alloc(0),
                    finalUrl: current,
                    oversize: false,
                    declaredSize: 0,
                  };
                }
                continue;
              }
              return res;
            }
            throw new Error('Too many HTTP redirects');
          }

          function normalizeShareUrl(raw) {
            const parsed = new URL(raw.trim());
            const host = parsed.hostname.toLowerCase();
            if (host === 'drive.google.com') {
              const m = parsed.pathname.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
              if (m) return `https://drive.google.com/uc?export=download&id=${m[1]}`;
              const openId = parsed.searchParams.get('id');
              if (parsed.pathname === '/open' && openId && /^[a-zA-Z0-9_-]+$/.test(openId)) {
                return `https://drive.google.com/uc?export=download&id=${openId}`;
              }
            }
            if (host === 'docs.google.com') {
              const docMatch = parsed.pathname.match(/\/document\/d\/([a-zA-Z0-9_-]+)/);
              if (docMatch) return `https://docs.google.com/document/d/${docMatch[1]}/export?format=pdf`;
              const sheetMatch = parsed.pathname.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
              if (sheetMatch) return `https://docs.google.com/spreadsheets/d/${sheetMatch[1]}/export?format=xlsx`;
              const slideMatch = parsed.pathname.match(/\/presentation\/d\/([a-zA-Z0-9_-]+)/);
              if (slideMatch) return `https://docs.google.com/presentation/d/${slideMatch[1]}/export?format=pdf`;
            }
            if (host === 'www.dropbox.com' || host === 'dropbox.com') {
              parsed.searchParams.set('dl', '1');
              return parsed.toString();
            }
            if (host === 'github.com') {
              const m = parsed.pathname.match(/^\/([^/]+)\/([^/]+)\/blob\/(.+)$/);
              if (m) return `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}`;
            }
            return parsed.toString();
          }

          function sanitizeFilename(name) {
            const base = path.basename(name).replace(/[\r\n\0<>:"/\\|?*]+/g, '_').replace(/^\.+/, '').trim();
            return (base || 'downloaded-file').slice(0, 160);
          }

          function inferFilename(urlObj, disp, mime) {
            if (disp) {
              const u = disp.match(/filename\*\s*=\s*UTF-8''([^;]+)/i);
              if (u && u[1]) {
                try { return sanitizeFilename(decodeURIComponent(u[1].trim().replace(/^"|"$/g, ''))); } catch {}
              }
              const p = disp.match(/filename\s*=\s*"([^"]+)"/i) || disp.match(/filename\s*=\s*([^;]+)/i);
              if (p && p[1]) return sanitizeFilename(p[1].trim().replace(/^"|"$/g, ''));
            }
            let seg = '';
            try { seg = sanitizeFilename(decodeURIComponent(urlObj.pathname.split('/').filter(Boolean).pop() || '')); } catch {}
            const ext = MIME_TO_EXT[mime] || '';
            if (seg && seg !== 'uc' && seg !== 'download' && seg !== 'export') {
              return !path.extname(seg) && ext ? `${seg}${ext}` : seg;
            }
            return `file-${Date.now()}${ext || '.bin'}`;
          }

          function decodeHtmlUrl(raw) {
            return raw.replace(/&amp;/gi, '&').replace(/&#38;/g, '&').replace(/&#x26;/gi, '&').trim();
          }

          function getHtmlAttr(tag, attrName) {
            const rx = new RegExp('(?:^|\\s)' + attrName + '\\s*=\\s*(?:"([^"]*)"|\'([^\']*)\'|([^\\s"\'=<>\\x60]+))', 'i');
            const m = tag.match(rx);
            const v = (m && (m[1] || m[2] || m[3])) || '';
            return v.trim() || null;
          }

          function resolveHttpUrl(baseUrl, raw) {
            if (!raw) return null;
            const cleaned = decodeHtmlUrl(raw);
            if (!cleaned || /^data:|^javascript:|^mailto:|^blob:/i.test(cleaned)) return null;
            try {
              const candidate = new URL(cleaned, baseUrl);
              if (candidate.protocol === 'http:' || candidate.protocol === 'https:') return candidate.toString();
            } catch {}
            return null;
          }

          function pickBestSrcset(baseUrl, srcset) {
            if (!srcset) return null;
            let bestUrl = null;
            let bestScore = -1;
            for (const entry of srcset.split(',')) {
              const parts = entry.trim().split(/\s+/);
              const resolved = resolveHttpUrl(baseUrl, parts[0]);
              if (!resolved) continue;
              const desc = parts[1] || '';
              let score = 1;
              const wm = desc.match(/^(\d+)w$/i);
              const xm = desc.match(/^(\d+(?:\.\d+)?)x$/i);
              if (wm) score = Number(wm[1]);
              else if (xm) score = Number(xm[1]) * 500;
              if (score > bestScore) { bestScore = score; bestUrl = resolved; }
            }
            return bestUrl;
          }

          function isJunkImg(urlStr, tag) {
            const l = urlStr.toLowerCase();
            if (/\.svg(?:$|\?)|\.ico(?:$|\?)/i.test(l)) return true;
            if (/(?:favicon|sprite|pixel|spacer|1x1|blank\.|spinner|loader|loading\.|emoji|analytics|beacon)/i.test(l)) return true;
            if (tag) {
              const w = Number(getHtmlAttr(tag, 'width') || '0');
              const h = Number(getHtmlAttr(tag, 'height') || '0');
              if ((w > 0 && w < 64) || (h > 0 && h < 64)) return true;
            }
            return false;
          }

          function extractEmbeddedMedia(baseUrl, html) {
            const metaTags = html.match(/<meta\b[^>]*>/gi) || [];
            const mediaMeta = new Set(['og:video:secure_url', 'og:video:url', 'og:video', 'twitter:player:stream', 'og:audio:secure_url', 'og:audio:url', 'og:audio']);
            for (const tag of metaTags) {
              const key = (getHtmlAttr(tag, 'property') || getHtmlAttr(tag, 'name') || '').toLowerCase();
              if (!mediaMeta.has(key)) continue;
              const u = resolveHttpUrl(baseUrl, getHtmlAttr(tag, 'content'));
              if (u) return u;
            }
            const mediaTags = html.match(/<(?:video|audio|source)\b[^>]*>/gi) || [];
            for (const tag of mediaTags) {
              const u = resolveHttpUrl(baseUrl, getHtmlAttr(tag, 'src')) || resolveHttpUrl(baseUrl, getHtmlAttr(tag, 'data-src'));
              if (u) return u;
            }
            const anchorTags = html.match(/<a\b[^>]*>/gi) || [];
            for (const tag of anchorTags.slice(0, 120)) {
              const candidate = resolveHttpUrl(baseUrl, getHtmlAttr(tag, 'href'));
              if (!candidate) continue;
              try {
                const parsed = new URL(candidate);
                const hasDl = /\bdownload\b/i.test(tag);
                if (/\.(?:mp3|wav|m4a|ogg|flac|aac|mp4|webm|mov|mkv|pdf|zip|docx|xlsx|pptx)(?:$|\?)/i.test(parsed.pathname) || (hasDl && !/\.(?:html?|php|aspx?)$/i.test(parsed.pathname))) {
                  return candidate;
                }
              } catch {}
            }
            const imageMeta = new Set(['og:image:secure_url', 'og:image:url', 'og:image', 'twitter:image:src', 'twitter:image', 'image']);
            for (const tag of metaTags) {
              const key = (getHtmlAttr(tag, 'property') || getHtmlAttr(tag, 'name') || getHtmlAttr(tag, 'itemprop') || '').toLowerCase();
              if (!imageMeta.has(key)) continue;
              const u = resolveHttpUrl(baseUrl, getHtmlAttr(tag, 'content'));
              if (u && !isJunkImg(u, '')) return u;
            }
            const linkTags = html.match(/<link\b[^>]*>/gi) || [];
            for (const tag of linkTags) {
              if ((getHtmlAttr(tag, 'rel') || '').toLowerCase().includes('image_src')) {
                const u = resolveHttpUrl(baseUrl, getHtmlAttr(tag, 'href'));
                if (u && !isJunkImg(u, '')) return u;
              }
            }
            const jsonLdMatches = html.match(/"(?:contentUrl|image)"\s*:\s*"(https?:\\?\/\\?\/[^"]+)"/gi) || [];
            for (const entry of jsonLdMatches) {
              const m = entry.match(/"(https?:[^"]+)"/i);
              if (!m || !m[1]) continue;
              const candidate = resolveHttpUrl(baseUrl, m[1].replace(/\\\//g, '/'));
              if (candidate && /\.(?:jpe?g|png|webp|gif|avif|mp4|mp3)(?:$|\?)/i.test(candidate) && !isJunkImg(candidate, '')) return candidate;
            }
            const imgTags = html.match(/<img\b[^>]*>/gi) || [];
            let bestUrl = null;
            let bestScore = -1;
            for (const tag of imgTags.slice(0, 80)) {
              const candidate =
                pickBestSrcset(baseUrl, getHtmlAttr(tag, 'data-srcset')) ||
                pickBestSrcset(baseUrl, getHtmlAttr(tag, 'srcset')) ||
                resolveHttpUrl(baseUrl, getHtmlAttr(tag, 'data-original')) ||
                resolveHttpUrl(baseUrl, getHtmlAttr(tag, 'data-lazy-src')) ||
                resolveHttpUrl(baseUrl, getHtmlAttr(tag, 'data-src')) ||
                resolveHttpUrl(baseUrl, getHtmlAttr(tag, 'src'));
              if (!candidate || isJunkImg(candidate, tag)) continue;
              let score = 10;
              const lower = candidate.toLowerCase();
              const info = ((getHtmlAttr(tag, 'class') || '') + ' ' + (getHtmlAttr(tag, 'alt') || '')).toLowerCase();
              const w = Number(getHtmlAttr(tag, 'width') || '0');
              const h = Number(getHtmlAttr(tag, 'height') || '0');
              if (w >= 300) score += 40; else if (w >= 150) score += 20;
              if (h >= 200) score += 20;
              if (/\.(?:jpe?g|png|webp|avif)(?:$|\?)/i.test(lower)) score += 15;
              if (/(?:uploads|media|images|photos|gallery|article|hero|cover|product)/i.test(lower)) score += 15;
              if (/(?:hero|main|featured|photo|cover|gallery|product|article)/i.test(info)) score += 15;
              if (/(?:logo|icon|avatar|badge|banner-ad|header)/i.test(lower + ' ' + info)) score -= 25;
              if (score > bestScore) { bestScore = score; bestUrl = candidate; }
            }
            return bestUrl;
          }

          function isGeminiShareUrl(parsedUrl) {
            const host = parsedUrl.hostname.toLowerCase();
            if (host === 'share.gemini.google' && parsedUrl.pathname.replace(/\//g, '').length > 0) return true;
            if (host === 'gemini.google.com' && /^\/share\/[a-zA-Z0-9_-]{4,80}/.test(parsedUrl.pathname)) return true;
            return false;
          }

          function upgradeGoogleImgUrl(rawUrl) {
            try {
              const parsed = new URL(rawUrl);
              if (/^(?:lh\d+|geo\d+)\.googleusercontent\.com$/i.test(parsed.hostname) && /\/(?:gg|rd-gg)\//.test(parsed.pathname)) {
                if (!/=[a-zA-Z0-9_-]+$/.test(parsed.pathname)) {
                  const full = new URL(parsed.toString());
                  full.pathname = parsed.pathname + '=s0';
                  return { primary: full.toString(), fallback: parsed.toString() };
                }
              }
            } catch {}
            return { primary: rawUrl, fallback: null };
          }

          function collectUrlsFromGeminiTurn(node, contribs, images, otherMedia, seenRaw, depth = 0) {
            if (depth > 30 || node === null || node === undefined) return;
            if (typeof node === 'string') {
              if (node.startsWith('https://')) {
                const cleaned = node.trim();
                if (seenRaw.has(cleaned)) return;
                seenRaw.add(cleaned);
                try {
                  const u = new URL(cleaned);
                  const host = u.hostname.toLowerCase();
                  if (host === 'contribution.usercontent.google.com' && u.pathname.startsWith('/download')) {
                    contribs.push(cleaned);
                  } else if (/^(?:lh\d+|geo\d+)\.googleusercontent\.com$/i.test(host) && /\/(?:gg|rd-gg)\//.test(u.pathname)) {
                    images.push(cleaned);
                  } else if (
                    !host.endsWith('gstatic.com') &&
                    host !== 'fonts.googleapis.com' &&
                    host !== 'gemini.google.com' &&
                    !u.pathname.startsWith('/a/') &&
                    /\.(?:mp4|webm|mov|mkv|mp3|wav|m4a|ogg|flac|pdf|pptx|docx|xlsx|zip|png|jpe?g|webp|gif)(?:$|\?)/i.test(u.pathname)
                  ) {
                    otherMedia.push(cleaned);
                  }
                } catch {}
              }
              return;
            }
            if (Array.isArray(node)) {
              for (let i = 0; i < node.length; i++) collectUrlsFromGeminiTurn(node[i], contribs, images, otherMedia, seenRaw, depth + 1);
              return;
            }
            if (typeof node === 'object') {
              for (const val of Object.values(node)) collectUrlsFromGeminiTurn(val, contribs, images, otherMedia, seenRaw, depth + 1);
            }
          }

          async function resolveGeminiShareUrls(initialUrl) {
            let sharePageUrl = initialUrl;
            if (initialUrl.hostname.toLowerCase() === 'share.gemini.google') {
              const r = await httpRequestWithLargeHeaders(initialUrl.toString(), {
                method: 'GET',
                maxBytes: 262144,
                stopOnRedirectMatch: (nextUrl) =>
                  nextUrl.hostname.toLowerCase() === 'gemini.google.com' && /\/share\/[a-zA-Z0-9_-]{4,80}/.test(nextUrl.pathname),
              });
              sharePageUrl = r.finalUrl;
            }

            if (sharePageUrl.hostname.toLowerCase() !== 'gemini.google.com') {
              throw new Error('Gemini share link did not redirect to gemini.google.com');
            }
            const m = sharePageUrl.pathname.match(/\/share\/([a-zA-Z0-9_-]{4,80})/);
            if (!m || !m[1]) throw new Error('Could not parse Gemini share ID');
            const shareId = m[1];

            const batchUrl = `https://gemini.google.com/_/BardChatUi/data/batchexecute?rpcids=ujx1Bf&source-path=${encodeURIComponent('/share/' + shareId)}&hl=en&rt=c`;
            const fReq = JSON.stringify([[['ujx1Bf', JSON.stringify([null, shareId, [4]]), null, 'generic']]]);
            const batchRes = await httpRequestWithLargeHeaders(batchUrl, {
              method: 'POST',
              maxBytes: 8 * 1024 * 1024,
              headers: {
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',
                'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                Accept: '*/*',
                'X-Same-Domain': '1',
                Origin: 'https://gemini.google.com',
                Referer: `https://gemini.google.com/share/${shareId}`,
                Cookie: 'SOCS=CAESEwgDEgk0ODE3Nzk3MjQaAmVuIAEaBgiA_LyaBg',
              },
              body: 'f.req=' + encodeURIComponent(fReq),
            });

            if (batchRes.status < 200 || batchRes.status >= 300) {
              throw new Error(`Gemini share API returned HTTP ${batchRes.status}`);
            }

            const rawText = batchRes.buffer.toString('utf8');
            let payloadStr = null;
            for (const line of rawText.split(/\r?\n/)) {
              const trimmed = line.trim();
              if (!trimmed.startsWith('[')) continue;
              try {
                const parsed = JSON.parse(trimmed);
                if (Array.isArray(parsed)) {
                  for (const item of parsed) {
                    if (Array.isArray(item) && item[0] === 'wrb.fr' && item[1] === 'ujx1Bf' && typeof item[2] === 'string') {
                      payloadStr = item[2];
                      break;
                    }
                  }
                }
                if (payloadStr) break;
              } catch {}
            }

            if (!payloadStr) {
              throw new Error('Gemini share payload is empty or private');
            }

            const data = JSON.parse(payloadStr);
            const rawMeta = Array.isArray(data && data[0]) ? data[0] : [];
            const turns = Array.isArray(rawMeta[1]) ? rawMeta[1] : [];

            const candidates = [];
            const seenKeys = new Set();
            for (let t = turns.length - 1; t >= 0; t--) {
              const contribs = [];
              const images = [];
              const otherMedia = [];
              collectUrlsFromGeminiTurn(turns[t], contribs, images, otherMedia, new Set());
              for (const rawUrl of [...contribs, ...images, ...otherMedia]) {
                const pair = upgradeGoogleImgUrl(rawUrl);
                const key = pair.fallback || pair.primary;
                if (seenKeys.has(key)) continue;
                seenKeys.add(key);
                candidates.push(pair);
              }
            }

            if (!candidates.length) {
              throw new Error('No downloadable files or images found inside this Gemini share link');
            }

            const validAssets = [];
            for (const pair of candidates.slice(0, 20)) {
              if (validAssets.length >= 10) break;
              const urlsToTry = pair.fallback ? [pair.primary, pair.fallback] : [pair.primary];
              for (const u of urlsToTry) {
                try {
                  const downloaded = await downloadFile(u, false, 'https://gemini.google.com/');
                  if (downloaded.mime !== 'text/html') {
                    validAssets.push(downloaded);
                    break;
                  }
                } catch {}
              }
            }

            if (!validAssets.length) {
              throw new Error('Gemini share files or images returned HTTP 403/404 and are no longer publicly downloadable');
            }
            return validAssets;
          }

          async function downloadFile(initialUrl, allowEmbeddedRetry = true, refererUrl = '') {
            const reqHeaders = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36',
              Accept: 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,audio/*,video/*,*/*;q=0.8',
              'Accept-Language': 'he-IL,he;q=0.9,en-US;q=0.8,en;q=0.7',
            };
            if (refererUrl) reqHeaders.Referer = refererUrl;

            const res = await httpRequestWithLargeHeaders(normalizeShareUrl(initialUrl), {
              method: 'GET',
              maxBytes: MAX_ARTIFACT_BYTES,
              timeoutMs: FETCH_TIMEOUT_MS,
              maxRedirects: MAX_REDIRECTS,
              headers: reqHeaders,
            });

            if (res.status < 200 || res.status >= 300) {
              throw new Error(`Remote server returned HTTP ${res.status} for ${res.finalUrl.hostname}`);
            }

            const mime = (res.headers['content-type'] || 'application/octet-stream').split(';')[0].trim().toLowerCase();
            const disp = res.headers['content-disposition'] || null;
            const filename = inferFilename(res.finalUrl, disp, mime);

            if (res.oversize) {
              return {
                oversizeArtifact: true,
                tooLargeForEmail: true,
                buffer: Buffer.alloc(0),
                filename,
                mime,
                sizeBytes: res.declaredSize,
                resolvedUrl: res.finalUrl.toString(),
              };
            }

            if (res.buffer.byteLength === 0) {
              throw new Error(`Downloaded empty file (0 bytes) from ${res.finalUrl.hostname}`);
            }

            if (allowEmbeddedRetry && mime === 'text/html') {
              const embedded = extractEmbeddedMedia(res.finalUrl, res.buffer.subarray(0, 524288).toString('utf8'));
              if (embedded) {
                try {
                  const extracted = await downloadFile(embedded, false, res.finalUrl.toString());
                  if (extracted.mime !== 'text/html') {
                    return extracted;
                  }
                } catch (subErr) {
                  console.warn('Embedded media retry failed:', subErr && subErr.message ? subErr.message : subErr);
                }
              }
            }

            return {
              oversizeArtifact: false,
              tooLargeForEmail: res.buffer.byteLength > MAX_EMAIL_BYTES,
              buffer: res.buffer,
              filename,
              mime,
              sizeBytes: res.buffer.byteLength,
              resolvedUrl: res.finalUrl.toString(),
            };
          }

          async function main() {
            const targetUrl = (process.env.TARGET_URL || '').trim();
            const to = (process.env.RECIPIENT_EMAIL || '').replace(/[\r\n]+/g, '').trim();
            const customSubject = (process.env.CUSTOM_SUBJECT || '').replace(/[\r\n]+/g, ' ').trim();
            const customFilename = (process.env.CUSTOM_FILENAME || '').trim();
            const gmailUser = (process.env.GMAIL_USER || '').trim();
            const gmailPass = (process.env.GMAIL_APP_PASSWORD || '').replace(/[\s-]+/g, '').trim();
            const runUrl = process.env.RUN_URL || '';

            if (!targetUrl) {
              throw new Error('Missing TARGET_URL input');
            }
            if (!gmailUser || !gmailPass) {
              throw new Error('Missing GMAIL_USER or GMAIL_APP_PASSWORD repository secrets');
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)) {
              throw new Error('Invalid recipient email');
            }

            const validatedTarget = await validatePublicUrl(targetUrl);
            const transporter = nodemailer.createTransport({
              host: 'smtp.gmail.com',
              port: 465,
              secure: true,
              auth: { user: gmailUser, pass: gmailPass },
            });

            const outDir = '/tmp/link2mail-artifacts';
            fs.mkdirSync(outDir, { recursive: true });
            let hasArtifact = false;

            if (isGeminiShareUrl(validatedTarget)) {
              const geminiAssets = await resolveGeminiShareUrls(validatedTarget);
              const attachments = [];
              const overflowLinks = [];
              const usedNames = new Set();
              let attachedBytes = 0;

              for (let idx = 0; idx < geminiAssets.length; idx++) {
                const asset = geminiAssets[idx];
                let name = idx === 0 && customFilename ? sanitizeFilename(customFilename) : asset.filename;
                if (usedNames.has(name)) {
                  const ext = path.extname(name);
                  const base = path.basename(name, ext);
                  name = sanitizeFilename(`${base}-${idx + 1}${ext}`);
                }
                usedNames.add(name);

                if (!asset.oversizeArtifact && !asset.tooLargeForEmail && attachedBytes + asset.sizeBytes <= MAX_MULTI_EMAIL_BYTES) {
                  attachments.push({ filename: name, content: asset.buffer, contentType: asset.mime });
                  attachedBytes += asset.sizeBytes;
                } else {
                  overflowLinks.push(`${name} (${(asset.sizeBytes / (1024 * 1024)).toFixed(2)} MB): ${asset.resolvedUrl}`);
                  if (!asset.oversizeArtifact) {
                    const outPath = path.resolve(outDir, name);
                    if (!outPath.startsWith(outDir + path.sep)) throw new Error('Unsafe artifact path');
                    fs.writeFileSync(outPath, asset.buffer);
                    hasArtifact = true;
                  }
                }
              }

              if (process.env.GITHUB_OUTPUT) {
                fs.appendFileSync(process.env.GITHUB_OUTPUT, hasArtifact ? `has_artifact=true\nartifact_dir=${outDir}\n` : `has_artifact=false\n`);
              }

              const primaryName = (attachments[0] && attachments[0].filename) || geminiAssets[0].filename;
              const subject = customSubject || `שיתוף Gemini (${geminiAssets.length} קבצים/תמונות): ${primaryName}`;
              const totalMb = (attachedBytes / (1024 * 1024)).toFixed(2);
              const bodyLines = [
                `חולצו ${geminiAssets.length} קבצים/תמונות תקינים מתוך שיתוף Gemini והורדו בשרתי GitHub (מחוץ לסינון המקומי):`,
                targetUrl,
                '',
                attachments.length ? `מצורפים למייל ${attachments.length} קבצים (${totalMb} MB סה"כ).` : '',
                overflowLinks.length ? `\nקבצים נוספים שחרגו ממגבלת הצרופה (זמינים בקישורים הבאים):\n${overflowLinks.join('\n')}` : '',
                hasArtifact && runUrl ? `\nניתן להוריד קבצים נוספים מ-GitHub Artifacts:\n${runUrl}` : '',
              ].filter(Boolean);

              await transporter.sendMail({
                from: gmailUser,
                to,
                subject,
                text: bodyLines.join('\n'),
                attachments,
              });
              console.log(`Sent ${attachments.length} Gemini assets (${totalMb} MB) to ${to}`);
              return;
            }

            const result = await downloadFile(targetUrl);
            const finalName = customFilename ? sanitizeFilename(customFilename) : result.filename;

            if (result.tooLargeForEmail && !result.oversizeArtifact) {
              const outPath = path.resolve(outDir, finalName);
              if (!outPath.startsWith(outDir + path.sep)) {
                throw new Error('Unsafe artifact path');
              }
              fs.writeFileSync(outPath, result.buffer);
              hasArtifact = true;
            }

            if (process.env.GITHUB_OUTPUT) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, hasArtifact ? `has_artifact=true\nartifact_dir=${outDir}\n` : `has_artifact=false\n`);
            }

            const subject = customSubject || (result.tooLargeForEmail ? `קישור/קובץ גדול מהענן: ${finalName}` : `קובץ מהענן: ${finalName}`);
            const sizeMb = (result.sizeBytes / (1024 * 1024)).toFixed(2);

            if (result.tooLargeForEmail) {
              await transporter.sendMail({
                from: gmailUser,
                to,
                subject,
                text: [
                  `הקובץ "${finalName}" (${sizeMb} MB, ${result.mime}) הורד בשרתי GitHub (מחוץ לסינון המקומי), אך הוא גדול ממגבלת הצרופה של Gmail (18 MB).`,
                  '',
                  `קישור ישיר לקובץ:`,
                  result.resolvedUrl,
                  '',
                  !result.oversizeArtifact ? `ניתן גם להוריד את הקובץ ישירות מתוך GitHub Actions (Artifacts) בקישור:\n${runUrl}` : '',
                ].filter(Boolean).join('\n'),
              });
            } else {
              await transporter.sendMail({
                from: gmailUser,
                to,
                subject,
                text: `מצורף הקובץ "${finalName}" (${sizeMb} MB) שהורד בשרתי GitHub מחוץ לסינון המקומי מתוך:\n${result.resolvedUrl}`,
                attachments: [
                  {
                    filename: finalName,
                    content: result.buffer,
                    contentType: result.mime,
                  },
                ],
              });
            }

            console.log(`Sent ${finalName} (${sizeMb} MB) to ${to}`);
          }

          main().catch(async (err) => {
            const msg = (err && err.message ? String(err.message) : String(err)).replace(/[\r\n]+/g, ' ').slice(0, 500);
            console.log(`::error title=Link2Mail Failure::${msg}`);
            console.error(err);

            const gmailUser = (process.env.GMAIL_USER || '').trim();
            const gmailPass = (process.env.GMAIL_APP_PASSWORD || '').replace(/[\s-]+/g, '').trim();
            const to = (process.env.RECIPIENT_EMAIL || '').replace(/[\r\n]+/g, '').trim();
            const targetUrl = (process.env.TARGET_URL || '').trim();
            const runUrl = process.env.RUN_URL || '';

            if (gmailUser && gmailPass && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to) && !/EAUTH|535|Username and Password not accepted/i.test(msg)) {
              try {
                const transporter = nodemailer.createTransport({
                  host: 'smtp.gmail.com',
                  port: 465,
                  secure: true,
                  auth: { user: gmailUser, pass: gmailPass },
                });
                await transporter.sendMail({
                  from: gmailUser,
                  to,
                  subject: 'הורדת הקישור ב-GitHub נכשלה',
                  text: [
                    `לא ניתן היה להוריד או לשלוח את הקישור בשרתי GitHub:`,
                    targetUrl,
                    '',
                    `פירוט השגיאה: ${msg}`,
                    runUrl ? `\nקישור ליומן ההפעלה ב-GitHub:\n${runUrl}` : '',
                  ].filter(Boolean).join('\n'),
                });
              } catch {}
            }

            process.exit(1);
          });
          EOF

      - name: Upload Oversized Media as GitHub Artifact
        if: steps.worker.outputs.has_artifact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: link2mail-media
          path: ${{ steps.worker.outputs.artifact_dir }}
          retention-days: 7
